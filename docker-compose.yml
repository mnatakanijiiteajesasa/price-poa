services:
  # MONGODB
  mongo:
    image: mongo:6.0
    container_name: pricepoa_mongo
    # Single-node replica set: multi-document transactions AND Change Streams
    # (used by the embedding outbox) both require a replica set.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DB}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - pricepoa_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test -u ${MONGO_INITDB_ROOT_USERNAME} -p ${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot initialisation of the replica set (idempotent - safe to re-run).
  mongo-init:
    image: mongo:6.0
    container_name: pricepoa_mongo_init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command: >
      set -e;
      echo "Waiting for mongod...";
      until mongosh --host mongo --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --quiet --eval "db.runCommand({ping:1}).ok" >/dev/null 2>&1; do sleep 2; done;
      mongosh --host mongo --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --quiet --eval "
      var status = db.runCommand({replSetGetStatus:1});
      if (status.ok) { print('Replica set rs0 already initialised'); }
      else { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}); print('Replica set rs0 initiated'); }
      ";
    networks:
      - pricepoa_network

  # MONGO-EXPRESS (Dev Admin UI)
  mongo-express:
    image: mongo-express:latest
    container_name: pricepoa_mongo_express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    ports:
      - "8081:8081"
    networks:
      - pricepoa_network
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    profiles:
      - dev

  # FASTAPI BACKEND
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      network: host
    container_name: pricepoa_api
    environment:
      HF_TOKEN: ${HF_TOKEN}
      ENVIRONMENT: ${ENVIRONMENT}
      MONGODB_URI: ${MONGO_URI}
      MONGODB_DB: ${MONGODB_DB}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      API_RELOAD: ${API_RELOAD}
      API_LOG_LEVEL: ${API_LOG_LEVEL}
      # Meta WhatsApp Business API variables
      META_WHATSAPP_ACCESS_TOKEN: ${META_WHATSAPP_ACCESS_TOKEN}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID}
      META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET}
      # Telegram Bot variables
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      # Qdrant Vector Database
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}

    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./intelligence:/app/intelligence
      - ./database:/app/database
      - /app/__pycache__
      - hf_cache:/root/.cache/huggingface
    networks:
      - pricepoa_network
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: uvicorn main:app --host ${API_HOST} --port ${API_PORT} --reload

  # SCRAPER (Background Worker)
  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
      network: host
    container_name: pricepoa_scraper
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      MONGODB_URI: ${MONGO_URI}
      MONGODB_DB: ${MONGODB_DB}
      SCRAPER_LOG_LEVEL: ${SCRAPER_LOG_LEVEL}
      SCRAPER_CONCURRENT_REQUESTS: ${SCRAPER_CONCURRENT_REQUESTS}
      SCRAPER_DOWNLOAD_DELAY: ${SCRAPER_DOWNLOAD_DELAY}
      ENABLE_SCRAPER: ${ENABLE_SCRAPER}
    networks:
      - pricepoa_network
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - /app/__pycache__
    # Remove profiles to enable by default, or set ENABLE_SCRAPER=true in .env
    # profiles:
    #   - scraper

  # INTELLIGENCE SERVICE
  intelligence:
    build:
      context: .
      dockerfile: intelligence/Dockerfile
      network: host
    container_name: pricepoa_intelligence
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      MONGODB_URI: ${MONGO_URI}
      MONGODB_DB: ${MONGODB_DB}
      INTELLIGENCE_LOG_LEVEL: ${INTELLIGENCE_LOG_LEVEL:-info}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
    networks:
      - pricepoa_network
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./intelligence:/app
      - ./database:/app/database
      - /app/__pycache__
      - hf_cache:/root/.cache/huggingface
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pricepoa_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - pricepoa_network

networks:
  pricepoa_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1472
volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  qdrant_storage:
    driver: local
  hf_cache:              
    driver: local