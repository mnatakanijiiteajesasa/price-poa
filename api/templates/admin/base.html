<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PricePoa Admin - {{ title }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-width: 250px;
            max-width: 250px;
            background-color: #f8f9fa;
        }
        .main-content {
            flex-grow: 1;
        }
        .stat-card {
            border-left: 4px solid #007bff;
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .chart-container {
            height: 300px;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar bg-light border-end">
            <div class="p-3">
                <h5 class="mb-4">PricePoa Admin</h5>
                <nav class="nav flex-column">
                    <a class="nav-link {% if active == 'dashboard' %}active{% endif %}" href="{{ url_for('admin.dashboard') }}">
                        <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                    </a>
                    <a class="nav-link {% if active == 'trends' %}active{% endif %}" href="{{ url_for('admin.trends') }}">
                        <i class="fas fa-chart-line me-2"></i>Trends
                    </a>
                    <a class="nav-link {% if active == 'popular' %}active{% endif %}" href="{{ url_for('admin.popular') }}">
                        <i class="fas fa-fire me-2"></i>Popular
